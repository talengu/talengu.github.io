<li class="search-li">
  <input type="text" id="search-box" placeholder="搜索文章..." 
         style="padding:0.3em 0.6em; border-radius:4px; border:1px solid #ccc; width:150px; min-width:100px; max-width:250px;">
  <ul id="search-results" 
      style="position:absolute; top:100%; right:0; background:#fff; border:1px solid #ccc; 
             max-height:300px; overflow-y:auto; display:none; z-index:1000; list-style:none; 
             padding:0; margin:0; width:250px;"></ul>
</li>

<!-- CSS 可以放在 partial 里或单独引用 -->
<style>
/* ===== 搜索结果基础样式 ===== */

/* 桌面端：搜索框靠右浮动 */
.search-li {
  float: right;
  position: relative;
  margin-left: 1em;
}

.search-item {
  padding: 0.4em 0.6em;
}

.search-link {
  display: block;
  font-weight: 500;
  text-decoration: none;
  color: #007acc;
}

.search-snippet {
  font-size: 0.85em;
  color: #555;
  margin-top: 0.2em;
  line-height: 1.4;
}

/* 高亮关键词 */
.search-highlight {
  background: rgba(255, 235, 59, 0.5);
  padding: 0 0.15em;
  border-radius: 3px;
}

/* hover 效果 */
.search-item:hover {
  background-color: rgba(0, 0, 0, 0.05);
}

/* ===== 📱 手机端适配：搜索框与结果列表 ===== */
@media (max-width: 600px) {
  /* 搜索框换行时取消浮动，整行居中 */
  .search-li {
    float: none;
    display: block;
    margin: 0.6em auto 0;
    text-align: center;
  }
  #search-box {
    width: 110px;
  }
  #search-results {
    /* 不超过屏幕宽度，避免溢出 */
    width: min(250px, calc(100vw - 1.6em));
    right: -0.3em;
    max-height: 40vh;
  }
  .search-item {
    padding: 0.3em 0.4em;
  }
  /* 摘要最多显示2行，控制单项高度 */
  .search-snippet {
    font-size: 0.78em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
}

/* ===== 🌙 自动深色模式 ===== */
@media (prefers-color-scheme: dark) {

  .search-link {
    color: #4fc3f7;
  }

  .search-snippet {
    color: #aaa;
  }

  .search-item:hover {
    background-color: rgba(104, 99, 99, 0.273);
  }

  .search-highlight {
    background: rgba(255, 193, 7, 0.35);
  }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
<script>
fetch('{{ "/post/index.json" | relURL }}')
  .then(res => res.json())
  .then(data => {

    const fuse = new Fuse(data, {
      keys: [
        { name: "title", weight: 2 },
        { name: "summary", weight: 1 },
        { name: "content", weight: 0.7 }
      ],
      threshold: 0.3,
      ignoreLocation: true,
      minMatchCharLength: 2
    });

    const input = document.getElementById('search-box');
    const resultsEl = document.getElementById('search-results');

    function highlight(text, keyword) {
      if (!text) return '';
      const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escaped})`, 'gi');
      return text.replace(regex, '<mark class="search-highlight">$1</mark>');
    }

    function excerpt(text, keyword, length = 80) {
      const idx = text.toLowerCase().indexOf(keyword.toLowerCase());
      if (idx === -1) return text.slice(0, length) + '…';

      const start = Math.max(0, idx - length / 2);
      const end = Math.min(text.length, idx + length / 2);
      return '…' + text.slice(start, end) + '…';
    }

    input.addEventListener('input', function () {
      const query = this.value.trim();
      if (!query) {
        resultsEl.style.display = 'none';
        resultsEl.innerHTML = '';
        return;
      }

      const results = fuse.search(query);

      resultsEl.innerHTML = results.slice(0, 8).map(r => {
        const item = r.item;
        const snippet = excerpt(item.content || item.summary || '', query);

        return `
          <li class="search-item">
            <a href="${item.permalink}" class="search-link">
              ${highlight(item.title, query)}
            </a>
            <div class="search-snippet">
              ${highlight(snippet, query)}
            </div>
          </li>
        `;
      }).join('');

      resultsEl.style.display = results.length ? 'block' : 'none';
    });

    document.addEventListener('click', e => {
      if (!input.contains(e.target) && !resultsEl.contains(e.target)) {
        resultsEl.style.display = 'none';
      }
    });
  });
</script>
